name: Management API contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'contracts/management/**'
      - 'docs/api/management-v1.md'
      - 'docs/api/device-enrollment-v1.md'
      - '.github/workflows/management-contract.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/management/**'
      - 'docs/api/management-v1.md'
      - 'docs/api/device-enrollment-v1.md'
      - '.github/workflows/management-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/management
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: contracts/management/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=moderate
