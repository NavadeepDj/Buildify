name: CI

# Quality gate for every PR and every push to main.
# Formatting + static analysis + tests + compile checks must pass before merge.

on:
  pull_request:
    branches: [main, feat/assistant-language-planning]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: '3.41.2'

jobs:
  voice-tools:
    name: Voice tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test voice routing, invitations, callbacks and lifecycle
        run: node --test scripts/bolna-webcall.test.mjs scripts/bolna-languages.test.mjs scripts/bolna-status-call.test.mjs scripts/voice-session.test.mjs scripts/voice-processes.test.mjs
      - name: Test Windows launcher recovery
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/voice-launcher.test.ps1

  analyze:
    name: Format & analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        # Lists files that need `dart format` but does not fail the build.
        # Add --set-exit-if-changed once the whole tree has been formatted.
        run: dart format --output=none .

      - name: Analyze (static analysis / lints)
        run: flutter analyze

  test:
    name: Unit & widget tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage --reporter expanded

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
        # Tokenless upload works for public repos; add CODECOV_TOKEN secret for private.

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [apk, web]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        if: matrix.target == 'apk'
        run: flutter build apk --debug

      - name: Test Android voice call permissions and navigation
        if: matrix.target == 'apk'
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --tests com.example.buildify_flutter.VoiceCallPolicyTest

      - name: Build web
        if: matrix.target == 'web'
        run: flutter build web --release
