name: buildify
description: Local AI server and project hosting workspace.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  archive: ^3.6.1
  file_picker: ^8.0.7
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  http: ^1.2.2
  mime: ^1.0.6
  path: ^1.9.0
  path_provider: ^2.1.4
  sqflite_common_ffi: ^2.3.3
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
